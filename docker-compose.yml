services:
  oracle-26ai:
    image: gvenzl/oracle-free:26-slim
    container_name: f1-oracle-26ai
    environment:
      ORACLE_PASSWORD: f1telemetry
      APP_USER: f1app
      APP_USER_PASSWORD: f1app
    ports:
      - "1525:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  ollama:
    image: ollama/ollama:latest
    container_name: f1-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1-api
    ports:
      - "8100:8000"
    env_file:
      - .env
    depends_on:
      oracle-26ai:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: f1-frontend
    ports:
      - "3100:3000"
    depends_on:
      - api

volumes:
  oracle-data:
  ollama-data:
