[project]
name = "f1-telemetry-oracle"
version = "0.1.0"
description = "AI-powered F1 race engineer — sim telemetry vs real F1 data, backed by Oracle 23ai Free"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "oracledb>=2.5.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "websockets>=14.0",
    "ollama>=0.4.0",
    "numpy>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "testcontainers[oracle]>=4.9.0",
    "ruff>=0.8.0",
    "httpx",
    "respx>=0.22.0",
    "scikit-learn>=1.5.0",
    "onnx>=1.16.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Oracle DB container",
    "e2e: end-to-end Playwright tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.uv]
