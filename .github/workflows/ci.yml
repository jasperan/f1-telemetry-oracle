name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # -- Lint (Python) ---------------------------------------------------------
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # -- Lint (TypeScript) -----------------------------------------------------
  lint-frontend:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # -- API Unit Tests (no Oracle needed) -------------------------------------
  test-api:
    name: API Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m "not integration and not e2e" \
            --junitxml=reports/unit-results.xml
        env:
          ORACLE_DSN: localhost:1521/FREEPDB1
          ORACLE_USER: test
          ORACLE_PASSWORD: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/

  # -- Frontend Build + Test -------------------------------------------------
  test-frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100

  # -- Integration Tests (Oracle container, manual/scheduled) ----------------
  test-integration:
    name: Integration Tests (Oracle)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: f1telemetry
          APP_USER: f1app
          APP_USER_PASSWORD: f1app
        ports:
          - 1525:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 120s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Wait for Oracle
        run: |
          echo "Waiting for Oracle service container..."
          for i in $(seq 1 60); do
            if python -c "
          import oracledb
          try:
              conn = oracledb.connect(user='f1app', password='f1app', dsn='localhost:1525/FREEPDB1')
              conn.close()
              print('Oracle is ready')
          except:
              exit(1)
          " 2>/dev/null; then
              break
            fi
            echo "Attempt $i/60 -- waiting 5s..."
            sleep 5
          done

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short -m integration \
            --junitxml=reports/integration-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/

  # -- E2E Tests (docker compose + Playwright, manual/scheduled) -------------
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [test-api, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start full stack
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for services
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100 > /dev/null 2>&1; then
              echo "Frontend ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8100/health > /dev/null 2>&1; then
              echo "API ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

      - name: Tear down
        if: always()
        run: docker compose down -v
